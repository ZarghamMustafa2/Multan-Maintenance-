<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Multan Maintenance</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        .contact-form {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: var(--shadow);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--primary-blue);
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        .form-group textarea {
            height: 150px;
            resize: vertical;
        }
        .btn-submit {
            background: var(--primary-blue);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
        }
        .btn-submit:hover {
            background: var(--secondary-blue);
        }
        .contact-info {
            text-align: center;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">Multan Maintenance</div>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="pricing.html">Pricing</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="hero-small" style="background: linear-gradient(rgba(0, 51, 102, 0.8), rgba(0, 51, 102, 0.8)), url('assets/images/hero-bg.png'); background-size: cover; background-position: center; padding: 4rem 5%; color: white; text-align: center;">
        <h1>Contact Us</h1>
        <p>Get in touch for a premium maintenance experience.</p>
    </section>

    <section class="contact">
        <div class="contact-form">
            <h2 style="margin-bottom: 2rem; color: var(--primary-blue); text-align: center;">Send a Message</h2>
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="e.g. 0300 1234567" required>
                </div>
                <div class="form-group">
                    <label for="service">Interested Service</label>
                    <input type="text" id="service" placeholder="e.g. AC Repair, Plumbing" required>
                </div>
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" placeholder="Tell us about your requirements..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Submit Request</button>
            </form>
            
            <div class="contact-info">
                <p style="margin-bottom: 1rem; font-weight: 600;">Or reach us via WhatsApp:</p>
                <a href="https://wa.me/+923000000000?text=I%20need%20a%20maintenance%20service%20for%20my%20home." class="btn-whatsapp">WhatsApp Now</a>
            </div>
        </div>
    </section>
</main>

<footer>
    <p>&copy; 2026 Multan Maintenance. Quality service in DHA, Cantt & Gulgasht.</p>
</footer>

<script>
    document.getElementById('contactForm')?.addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Thank you for your message! Our team will contact you shortly.');
        this.reset();
    });
</script>

</body>
</html>
